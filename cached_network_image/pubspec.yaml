name: cached_image
description: >
  Flutter library to load and cache network images. Metadata storage is
  pluggable (no Hive/MMKV/sqflite bundled). Maintained fork:
  https://github.com/blackstorm/flutter_cached_image
homepage: https://github.com/blackstorm/flutter_cached_image
repository: https://github.com/blackstorm/flutter_cached_image
topics:
  - cache
  - image
  - network-image
version: 4.10.0

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  cached_image_platform_interface:
    path: ../cached_network_image_platform_interface
  crypto: ^3.0.0
  file: ">=7.0.0 <8.0.0"
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.9.0
  octo_image: ^2.1.0
  path: ^1.8.0
  path_provider: ^2.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
